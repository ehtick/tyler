[workspace]
resolver = "2"

[package]
name = "cityjson-convert-gis-integration"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
cityjson-convert = { path = "../..", default-features = false, features = ["proj-system"] }
cityjson-lib = { version = "0.10.0", default-features = false }
geos = "11.1.1"
postgres = "0.19.14"
rusqlite = "0.37.0"
tempfile = "3"

[patch.crates-io]
cityjson-lib = { git = "https://github.com/3DGI/cityjson-rs.git", rev = "acd4670e90603bf3eb99c9ce8926bb02c9bd4769" }
cityjson-index = { git = "https://github.com/3DGI/cityjson-rs.git", rev = "acd4670e90603bf3eb99c9ce8926bb02c9bd4769" }
cityjson-types = { git = "https://github.com/3DGI/cityjson-rs.git", rev = "acd4670e90603bf3eb99c9ce8926bb02c9bd4769" }
cityjson-json = { git = "https://github.com/3DGI/cityjson-rs.git", rev = "acd4670e90603bf3eb99c9ce8926bb02c9bd4769" }
