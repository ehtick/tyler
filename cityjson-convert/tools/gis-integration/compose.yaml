services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: cityjson_gis
      POSTGRES_USER: cityjson
      POSTGRES_PASSWORD: cityjson
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cityjson -d cityjson_gis"]
      interval: 2s
      timeout: 5s
      retries: 30

  tests:
    build:
      context: ../../..
      dockerfile: cityjson-convert/tools/gis-integration/Dockerfile
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://cityjson:cityjson@postgis:5432/cityjson_gis
    working_dir: /workspace
    volumes:
      - ../../..:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target:/workspace/cityjson-convert/tools/gis-integration/target
    command:
      - cargo
      - test
      - --manifest-path
      - cityjson-convert/tools/gis-integration/Cargo.toml
      - --
      - --nocapture

volumes:
  cargo-registry:
  cargo-git:
  target:
